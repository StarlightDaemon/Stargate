<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0d">
<meta name="color-scheme" content="dark">
<title>Stargate Builds — Gallery Hub</title>
<meta name="description" content="Catalog of original, fully client-side portal-dialing website builds.">
<link rel="canonical" href="https://starlightdaemon.github.io/Stargate/hub/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stargate Builds">
<meta property="og:title" content="Stargate Builds — Gallery Hub">
<meta property="og:description" content="Explore original, fully client-side portal-dialing website builds.">
<meta property="og:url" content="https://starlightdaemon.github.io/Stargate/hub/">
<meta property="og:image" content="https://starlightdaemon.github.io/Stargate/Stargate_OG/preview.png">
<meta property="og:image:width" content="1920">
<meta property="og:image:height" content="1080">
<meta property="og:image:alt" content="A glowing circular portal interface from the featured Stargate build">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Stargate Builds — Gallery Hub">
<meta name="twitter:description" content="Explore original, fully client-side portal-dialing website builds.">
<meta name="twitter:image" content="https://starlightdaemon.github.io/Stargate/Stargate_OG/preview.png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to gallery</a>
<canvas id="stars" aria-hidden="true"></canvas>

<main id="main-content" tabindex="-1">
  <header id="hub-head">
    <div>
      <h1>STARGATE BUILDS</h1>
      <p class="sub">GALLERY HUB &middot; ORIGINAL PORTAL-DIALING CONSOLES</p>
    </div>
  </header>

  <section id="featured" aria-label="Featured build" hidden></section>

  <section id="filter-bar" aria-label="Status filter">
    <span class="filter-label">SHOW</span>
    <div id="status-filter" role="group" aria-label="Filter by status">
      <button class="filter-btn" data-status="all" aria-pressed="false">ALL</button>
      <button class="filter-btn active" data-status="live" aria-pressed="true">LIVE</button>
      <button class="filter-btn" data-status="known-issue" aria-pressed="false">KNOWN ISSUE</button>
      <button class="filter-btn" data-status="retired" aria-pressed="false">RETIRED</button>
    </div>
    <span id="filter-count" class="filter-count" aria-live="polite"></span>
  </section>

  <section id="grid" aria-label="Build gallery"></section>

  <p id="empty-state" hidden>No builds match this filter.</p>

  <footer id="site-footer">
    <p>Original fan-made novelty project. Not affiliated with or endorsed by MGM or the Stargate franchise.</p>
    <p><a href="https://github.com/StarlightDaemon/Stargate">Source code</a> · <a rel="license" href="https://github.com/StarlightDaemon/Stargate/blob/main/LICENSE">MIT license</a></p>
  </footer>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
