name: Deploy hub to GitHub Pages

on:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish
# rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Deploy only on pushes to whatever branch GitHub currently has
    # configured as this repo's default branch, without hardcoding a name.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Stargate_OG is the one folder that is a real app rather than a
      # static build folder: it needs tsc + vite build to produce servable
      # files. Its dist/ is never committed, so it is rebuilt here, in the
      # runner's ephemeral workspace, on every push. build-pages-site.js
      # copies the result into _site/Stargate_OG/ in the next step.
      - name: Build featured app (Stargate_OG)
        working-directory: Stargate_OG
        run: |
          npm ci
          npm run build

      - name: Assemble static site (hub + qualifying build folders)
        run: node scripts/build-pages-site.js "$GITHUB_WORKSPACE/_site"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
