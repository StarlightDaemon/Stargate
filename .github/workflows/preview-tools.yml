      - run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: node scripts/check-consolidation.js
      - name: Qualify Erebus security replacement and preserve its existing behavior
        env:
          STARGATE_LOG_VISUALS: '1'
        run: node scripts/check-erebus-security.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consolidation-evidence
          path: |
            test/consolidation/
            test/erebus-security/
          retention-days: 30
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test real HTTP, containment, links, lifecycle and verification diagnostics
        run: node --test --test-isolation=none scripts/test-preview.js scripts/test-preview-handlers.js scripts/test-preview-api.js scripts/test-verification.js scripts/test-qualified-suites.js scripts/test-exhibit-dependency-candidates.js scripts/test-deepscope-cancellation.js scripts/test-package-entry-adapter.js scripts/test-vite-built-preview.js scripts/test-package-entry-viewport.js scripts/test-qualification-vite-process.js scripts/test-freeform-cancellation.js
      - name: Check gallery
        run: node hub/generate.js --check
      - name: Check Pages output guard
        run: node scripts/test-build-pages-output-guard.js
      - name: Check hub security
        run: node scripts/audit-hub-security.js --strict
      - name: Check active metadata and static references (not operator acceptance)
        run: >-
          node -e 'require("./scripts/verify.js").main([]).then(r=>{process.exitCode=r.summary.FAIL||r.summary["ENVIRONMENT-BLOCKED"]?1:0;console.log("Static gate only; unrequested runtime and operator checks remain UNVERIFIED.")}).catch(e=>{console.error(e);process.exitCode=1})'

  pilot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      STARGATE_LOG_VISUALS: '1'
      STARGATE_PUPPETEER_MODULE: ${{ github.workspace }}/node_modules/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Locate existing Chrome
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Install shared locked browser-test dependency
        run: npm ci --ignore-scripts
      - name: Run original builder suites against both servers
        run: node scripts/run-pilot-suites.js
      - name: Compare pilot browser behavior with legacy and shared serving
        if: ${{ !cancelled() }}
        run: node scripts/check-pilot-browsers.js
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-browser-evidence
          path: |
            test/pilot-browser/
            test/pilot-suites/
          retention-days: 30
