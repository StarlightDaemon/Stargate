name: Verify preview tooling (no deploy)

on:
  pull_request:

permissions:
  contents: read

jobs:
  blueprint-dependency-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Generate isolated Blueprint lock candidate with npm
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const dir = path.resolve('test/blueprint-dependency-candidate');
          fs.mkdirSync(dir, { recursive: true });
          const pkg = JSON.parse(fs.readFileSync('stargate_blueprint_alpha/package.json'));
          delete pkg.devDependencies.serve;
          fs.writeFileSync(path.join(dir, 'package.json'), JSON.stringify(pkg, null, 2) + '\n');
          fs.copyFileSync('stargate_blueprint_alpha/package-lock.json', path.join(dir, 'package-lock.json'));
          const npm = args => execFileSync('npm', args, { cwd: dir, encoding: 'utf8', timeout: 90000 });
          console.log(npm(['update', 'puppeteer', '--package-lock-only', '--ignore-scripts']));
          let lock = JSON.parse(fs.readFileSync(path.join(dir, 'package-lock.json')));
          const version = lock.packages['node_modules/puppeteer'].version;
          if (!/^25\./.test(version)) throw new Error('Unexpected major: ' + version);
          pkg.devDependencies.puppeteer = '^' + version;
          fs.writeFileSync(path.join(dir, 'package.json'), JSON.stringify(pkg, null, 2) + '\n');
          console.log(npm(['install', '--package-lock-only', '--ignore-scripts']));
          let audit;
          try { audit = npm(['audit', '--json']); }
          catch (e) { if (e.status !== 1 || !e.stdout) throw e; audit = e.stdout; }
          fs.writeFileSync(path.join(dir, 'audit.json'), audit);
          console.log('BLUEPRINT_CANDIDATE_AUDIT ' + audit.replace(/\n/g, ''));
          lock = JSON.parse(fs.readFileSync(path.join(dir, 'package-lock.json')));
          console.log('BLUEPRINT_CANDIDATE_PACKAGES ' + JSON.stringify(Object.fromEntries(Object.entries(lock.packages).map(([k,v]) => [k, { version: v.version, dependencies: v.dependencies }]))));
          for (const file of ['package.json', 'package-lock.json']) {
            const data = fs.readFileSync(path.join(dir, file)).toString('base64');
            for (let offset = 0; offset < data.length; offset += 16000) console.log('BLUEPRINT_CANDIDATE ' + file + ' ' + offset + ' ' + data.slice(offset, offset + 16000));
          }
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: blueprint-dependency-candidate
          path: test/blueprint-dependency-candidate/
          retention-days: 30
  blueprint-security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      STARGATE_LOG_VISUALS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci --prefix stargate_blueprint_alpha
      - name: Qualify Blueprint custom, npm, embedded-test and shared entry points
        run: node scripts/check-blueprint-security.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blueprint-security-evidence
          path: test/blueprint-security/
          retention-days: 30
  reactor-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      STARGATE_LOG_VISUALS: '1'
      STARGATE_PUPPETEER_MODULE: ${{ github.workspace }}/stargate_aetheric_telegraph/node_modules/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci --prefix stargate_aetheric_telegraph
      - name: Preserve original Reactor suite and compare historical/shared security and interactions
        run: node scripts/check-reactor-security.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reactor-security-evidence
          path: test/reactor-security/
          retention-days: 30
  consolidation-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      STARGATE_PUPPETEER_MODULE: ${{ github.workspace }}/stargate_aetheric_telegraph/node_modules/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci --prefix stargate_aetheric_telegraph
      - run: node scripts/check-consolidation.js
      - name: Qualify Erebus security replacement and preserve its existing behavior
        env:
          STARGATE_LOG_VISUALS: '1'
        run: node scripts/check-erebus-security.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: consolidation-evidence
          path: |
            test/consolidation/
            test/erebus-security/
          retention-days: 30
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test real HTTP, containment, links, lifecycle and verification diagnostics
        run: node --test --test-isolation=none scripts/test-preview.js scripts/test-preview-handlers.js scripts/test-verification.js
      - name: Check gallery
        run: node hub/generate.js --check
      - name: Check Pages output guard
        run: node scripts/test-build-pages-output-guard.js
      - name: Check hub security
        run: node scripts/audit-hub-security.js --strict
      - name: Check active metadata and static references (not operator acceptance)
        run: >-
          node -e 'require("./scripts/verify.js").main([]).then(r=>{process.exitCode=r.summary.FAIL||r.summary["ENVIRONMENT-BLOCKED"]?1:0;console.log("Static gate only; unrequested runtime and operator checks remain UNVERIFIED.")}).catch(e=>{console.error(e);process.exitCode=1})'

  pilot-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      STARGATE_LOG_VISUALS: '1'
      STARGATE_PUPPETEER_MODULE: ${{ github.workspace }}/stargate_aetheric_telegraph/node_modules/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Locate existing Chrome
        run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Install existing locked browser-test dependency
        run: npm ci --prefix stargate_aetheric_telegraph
      - name: Install Bathyscaphe's existing locked test dependency
        run: npm ci --prefix stargate_bathyscaphe_pilot
      - name: Run original builder suites against both servers
        run: node scripts/run-pilot-suites.js
      - name: Compare pilot browser behavior with legacy and shared serving
        if: ${{ !cancelled() }}
        run: node scripts/check-pilot-browsers.js
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-browser-evidence
          path: |
            test/pilot-browser/
            test/pilot-suites/
          retention-days: 30
