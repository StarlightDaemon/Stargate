name: Verify preview tooling (no deploy)

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Temporary read-only recovery of a completed comparison's original assertions.
  recover-cyberpunk-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read the recorded failure without rerunning or changing its predicates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/StarlightDaemon/Stargate/actions/artifacts/13632101247/zip > "$RUNNER_TEMP/cyberpunk-prior.zip"
          python - <<'PY'
          import os, zipfile
          archive = zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'], 'cyberpunk-prior.zip'))
          logs = [name for name in archive.namelist() if name.endswith('/original/run.log')]
          assert logs, 'Saved original run.log is required'
          for name in logs:
              print('RECOVERED_ORIGINAL_LOG', name)
              for line in archive.read(name).decode('utf-8').splitlines():
                  if line.startswith(('[PASS]', '[FAIL]')):
                      print(line)
          PY
  # One-off candidate generation is complete. CI now verifies committed locks.
  shared-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ls --all
      - run: npm run security:deps
      - run: git diff --exit-code -- package.json package-lock.json
  dependency-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Collect remaining active lockfile audits (findings remain acceptance failures)
        run: node scripts/check-dependency-baseline.js --strict --include-qualified
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: remaining-dependency-baseline
          path: |
            test/dependency-campaign/**/report.json
            test/dependency-campaign/**/audit.stdout.json
            test/dependency-campaign/**/audit.stderr.log
          retention-days: 30
  next-server-qualification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: built-orthographic_cad
            command: node scripts/check-vite-built-preview.js stargate_orthographic_cad
            evidence: test/vite-built-preview/stargate_orthographic_cad/
            package: stargate_orthographic_cad
          - target: built-radio_interferometry
            command: node scripts/check-vite-built-preview.js stargate_radio_interferometry
            evidence: test/vite-built-preview/stargate_radio_interferometry/
            package: stargate_radio_interferometry
          - target: built-seti_deepscope
            command: node scripts/check-vite-built-preview.js stargate_seti_deepscope
            evidence: test/vite-built-preview/stargate_seti_deepscope/
            package: stargate_seti_deepscope
          - target: built-seti_freeform
            command: node scripts/check-vite-built-preview.js stargate_seti_freeform
            evidence: test/vite-built-preview/stargate_seti_freeform/
            package: stargate_seti_freeform
          - target: freeform-manual-contract
            command: node scripts/check-freeform-manual-contract.js
            evidence: test/freeform-manual-contract/
          - target: cathedral-layout
