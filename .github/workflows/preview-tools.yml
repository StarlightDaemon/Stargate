        with:
          name: server-${{ matrix.target }}-evidence
          path: ${{ matrix.evidence }}
          retention-days: 30
  active-page-loads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      STARGATE_PUPPETEER_MODULE: ${{ github.workspace }}/node_modules/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Check every active static exhibit and its resources
        run: >-
          node -e 'require("./scripts/verify.js").main(["--http","--browser"]).then(r=>{process.exitCode=r.summary.FAIL||r.summary["ENVIRONMENT-BLOCKED"]?1:0;console.log("Page loading only; interaction and operator acceptance remain separate gates.")}).catch(e=>{console.error(e);process.exitCode=1})'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: active-page-load-evidence
          path: test/verification/
          retention-days: 30
  synchrotron-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      STARGATE_LOG_VISUALS: '1'
      STARGATE_PUPPETEER_MODULE: ${{ github.workspace }}/node_modules/puppeteer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
