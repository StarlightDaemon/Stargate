      - run: npm ci --ignore-scripts --prefix stargate_blueprint_alpha
      - name: Validate installed Blueprint dependency graph and unchanged lock
        run: |
          npm ls --prefix stargate_blueprint_alpha --all
          git diff --exit-code -- stargate_blueprint_alpha/package.json stargate_blueprint_alpha/package-lock.json
