<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src https://fonts.gstatic.com;
                   script-src 'self' 'unsafe-inline';
                   img-src 'self' data:;">
    <title>GATE DIALING COMPUTER - FUSION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/fusion.css">
</head>

<body>
    <div class="sdc-fusion-container" data-theme="terminal">
        <!-- HEADER BAR -->
        <header class="fusion-header">
            <span class="fusion-title">◆ GATE DIALING COMPUTER ◆</span>
            <span class="fusion-status">
                <span class="status-dot"></span>
                <span id="headerStatus">IDLE</span>
            </span>
        </header>

        <!-- QUICK DIAL PANEL (LEFT) -->
        <aside class="quick-dial-panel" id="quickDialPanel">
            <div class="quick-dial-header">
                <span class="quick-dial-title">◆ QUICK DIAL</span>
                <button class="quick-dial-pos-btn" id="quickDialPosBtn" title="Move panel">▶</button>
            </div>
            <div class="quick-dial-list" id="quickDialList"></div>
        </aside>

        <!-- GATE VIEWPORT (CENTER) -->
        <section class="gate-panel">
            <svg viewBox="-20 -20 540 540" class="stargate-svg" id="stargateSvg">
                <defs>
                    <!-- Gradient stop colors driven by CSS custom properties per theme -->
                    <radialGradient id="horizonGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="var(--horizon-c1)" />
                        <stop offset="70%"  stop-color="var(--horizon-c2)" />
                        <stop offset="100%" stop-color="var(--horizon-c3)" />
                    </radialGradient>
                    <radialGradient id="idleGate" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="var(--idle-gate-color)" stop-opacity="0.7" />
                        <stop offset="55%"  stop-color="var(--idle-gate-color)" stop-opacity="0.9" />
                        <stop offset="100%" stop-color="#000" stop-opacity="1" />
                    </radialGradient>
                    <!-- Locked-chevron glow — color follows chevron-inner fill automatically -->
                    <filter id="glow-locked" x="-25%" y="-25%" width="150%" height="150%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- ═══════════════════════════════════════════════════
                     OUTER RING ASSEMBLY
                     ═══════════════════════════════════════════════════ -->
                <g class="outer-ring-assembly">
                    <!-- Base fill — dark ring body background -->
                    <circle class="outer-ring-base" cx="250" cy="250" r="230" />

                    <!-- Arc panel segments: housing zones + glyph window panels
                         Built at runtime by buildRingSegments() in engine.js -->
                    <g id="ringSegments"></g>

                    <!-- Band 1: outer hard rim accent -->
                    <circle class="ring-band-outer" cx="250" cy="250" r="253" />
                    <!-- Band 2: inner edge accent -->
                    <circle class="ring-band-inner" cx="250" cy="250" r="208" />
                    <!-- Band 3: mid structural separator -->
                    <circle class="ring-band-mid"   cx="250" cy="250" r="236" />
                    <!-- Band 4: outer boundary faint edge -->
                    <circle class="outer-ring-boundary" cx="250" cy="250" r="255" />
                </g>

                <!-- ═══════════════════════════════════════════════════
                     CHEVRONS — 12 total at 30° pitch
                     ═══════════════════════════════════════════════════ -->
                <g class="chevrons" id="chevrons">
                    <g class="chevron" data-num="9"  transform="rotate(0,   250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="1"  transform="rotate(30,  250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="2"  transform="rotate(60,  250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="3"  transform="rotate(90,  250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="4"  transform="rotate(120, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="5"  transform="rotate(150, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="6"  transform="rotate(180, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="7"  transform="rotate(210, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="8"  transform="rotate(240, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="10" transform="rotate(270, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="11" transform="rotate(300, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                    <g class="chevron" data-num="12" transform="rotate(330, 250, 250)">
                        <polygon class="chevron-body"  points="210,-16 290,-16 290,-2 274,-2 274,14 268,22 250,74 232,22 226,14 226,-2 210,-2" />
                        <polygon class="chevron-inner" points="235,4 265,4 250,70" />
                    </g>
                </g>

                <!-- ═══════════════════════════════════════════════════
                     INNER RING — glyph track (rotates during dialing)
                     Contains glyph symbols + tick-mark ring for visible
                     rotation feedback (39 ticks, one per glyph slot).
                     Accent borders are fixed (outside the rotate group).
                     ═══════════════════════════════════════════════════ -->
                <!-- Fixed accent border — outer edge of inner ring -->
                <circle class="inner-ring-edge-outer" cx="250" cy="250" r="195" />
                <!-- Rotating group -->
                <g class="inner-ring" id="innerRing">
                    <circle class="inner-ring-track" cx="250" cy="250" r="175" />
                    <!-- 39 tick marks — one per glyph slot, rotate with ring -->
                    <circle class="ring-tick-marks" cx="250" cy="250" r="191" />
                </g>
                <!-- Fixed accent border — inner edge of inner ring -->
                <circle class="inner-ring-edge-inner" cx="250" cy="250" r="157" />

                <!-- Alignment mark — fixed locking indicator at 12 o'clock.
                     Rendered AFTER the rotating ring so it always appears on top.
                     Triangle tip points down from the outer ring's inner edge (r=202)
                     into the inner ring face, marking the glyph lock position. -->
                <g class="alignment-mark">
                    <polygon class="align-pointer" points="250,57 243,48 257,48" />
                    <line class="align-bracket" x1="240" y1="50" x2="240" y2="55" />
                    <line class="align-bracket" x1="260" y1="50" x2="260" y2="55" />
                </g>

                <!-- Event Horizon — idle shows subtle closed-portal depth -->
                <circle class="event-horizon" id="eventHorizon" cx="250" cy="250" r="150" />
            </svg>
            <div class="kawoosh-effect" id="kawooshEffect"></div>
        </section>

        <!-- RIGHT PANEL - UTILITY SIDEBAR -->
        <aside class="utility-panel">
            <div class="panel-title">◆ UTILITY AREA ◆</div>

            <!-- Gate Theme Selector -->
            <div class="utility-section theme-section">
                <div class="section-header">GATE THEME</div>
                <div class="theme-btns">
                    <button class="theme-btn" data-theme="terminal">
                        <div class="theme-swatch theme-swatch--terminal"></div>
                        <span>SDC</span>
                    </button>
                    <button class="theme-btn" data-theme="amber">
                        <div class="theme-swatch theme-swatch--amber"></div>
                        <span>MW</span>
                    </button>
                    <button class="theme-btn" data-theme="cyan">
                        <div class="theme-swatch theme-swatch--cyan"></div>
                        <span>PEG</span>
                    </button>
                </div>
            </div>

            <!-- Mode Select Section -->
            <div class="utility-section mode-section">
                <div class="section-header">MODE SELECT</div>
                <div class="mode-grid">
                    <button class="mode-btn active" data-mode="7">
                        <div class="mode-number">7</div>
                        <div class="mode-label">INTRA</div>
                    </button>
                    <button class="mode-btn" data-mode="8">
                        <div class="mode-number">8</div>
                        <div class="mode-label">INTER</div>
                    </button>
                    <button class="mode-btn" data-mode="9">
                        <div class="mode-number">9</div>
                        <div class="mode-label">DESTINY</div>
                    </button>
                    <button class="mode-btn" data-mode="10">
                        <div class="mode-number">10</div>
                        <div class="mode-label">TBD</div>
                    </button>
                    <button class="mode-btn" data-mode="11">
                        <div class="mode-number">11</div>
                        <div class="mode-label">TBD</div>
                    </button>
                    <button class="mode-btn" data-mode="12">
                        <div class="mode-number">12</div>
                        <div class="mode-label">TBD</div>
                    </button>
                </div>
            </div>

            <!-- Address Buffer Section -->
            <div class="utility-section buffer-section">
                <div class="section-header" id="bufferLabel">ADDRESS BUFFER — 7 CHEVRONS</div>
                <div class="buffer-slots" id="bufferSlots">
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot">—</div>
                    <div class="buffer-slot origin-slot">⊕</div>
                </div>
            </div>

            <!-- Input Area Section (Glyph Grid) -->
            <div class="utility-section input-section">
                <div class="section-header">INPUT AREA</div>
                <div class="glyph-grid" id="glyphGrid"></div>
            </div>

            <!-- Chevron Status Section -->
            <div class="utility-section chevron-section">
                <div class="section-header">CHEVRON STATUS</div>
                <div class="chevron-grid" id="chevronIndicators">
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                    <div class="chev-indicator"></div>
                </div>
            </div>

            <!-- Status Section -->
            <div class="utility-section status-section">
                <div class="section-header">STATUS</div>
                <div class="status-log" id="statusLog">AWAITING</div>
                <div class="dest-info" id="destInfo"></div>
            </div>

            <!-- Signal Strength Section -->
            <div class="utility-section signal-section">
                <div class="section-header">SIGNAL STRENGTH</div>
                <canvas id="signalCanvas" class="signal-canvas" width="400" height="80"></canvas>
                <div class="signal-stats">
                    <span>PEAK: <strong id="peakValue">98.4%</strong></span>
                    <span>AVG: <strong id="avgValue">85.2%</strong></span>
                </div>
            </div>

            <!-- Engage Button -->
            <button class="engage-button" id="engageBtn" disabled>ENGAGE</button>

            <!-- Dial Speed Control -->
            <div class="dial-speed-control">
                <span class="dial-speed-label">DIAL SPEED</span>
                <div class="dial-speed-btns">
                    <button class="dial-speed-btn active" data-speed="normal">NORMAL</button>
                    <button class="dial-speed-btn" data-speed="fast">FAST</button>
                    <button class="dial-speed-btn" data-speed="instant">INSTANT</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="logic/addresses.js"></script>
    <script src="logic/audio.js"></script>
    <script src="logic/ring.js"></script>
    <script src="logic/signal.js"></script>
    <script src="logic/engine.js"></script>
    <script src="logic/theme.js"></script>
</body>

</html>
